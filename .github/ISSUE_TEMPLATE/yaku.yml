name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 室生犀星 詩篇（『蜜のあわれ・われはうたえども やぶれかぶれ』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: murou-saisei-bc1e7bad-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
